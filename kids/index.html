<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Corner | The English Language School</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(180deg, #0b192c 0%, #1e3e62 40%, #0f172a 100%); background-attachment: fixed; color: #0f172a; min-height: 100vh; }
        .main-header { background-color: rgba(11, 25, 44, 0.85); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 3px solid #ff6500; position: sticky; top: 0; z-index: 1000; }
        .logo { color: #ffffff; font-size: 1.3rem; font-weight: 700; text-decoration: none; }
        .nav-btn { color: #ffffff; text-decoration: none; padding: 0.5rem 1.2rem; border-radius: 6px; font-weight: 600; background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .nav-btn:hover { background-color: #ff6500; border-color: #ff6500; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .page-title { color: #ffffff; font-size: 2.2rem; margin-bottom: 0.5rem; text-align: center; }
        .page-subtitle { color: #cbd5e1; text-align: center; margin-bottom: 2rem; font-size: 1.1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; }
        .card { background: #ffffff; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .card-img { width: 100%; height: 160px; object-fit: cover; }
        .card-content { padding: 1.2rem; display: flex; flex-direction: column; flex-grow: 1; }
        .card h3 { font-size: 1.1rem; color: #0b192c; margin-bottom: 0.5rem; }
        .card p { font-size: 0.9rem; color: #475569; margin-bottom: 1.2rem; flex-grow: 1; }
        .btn { display: block; text-align: center; background-color: #ff6500; color: #fff; text-decoration: none; padding: 0.7rem; border-radius: 8px; font-weight: 700; }
        .btn:hover { background-color: #e05500; }
    </style>
</head>
<body>
    <header class="main-header">
      <a href="../index.html" class="logo">The English Language School</a>
      <a href="../index.html" class="nav-btn">← Home</a>
    </header>
    <main class="container">
        <h1 class="page-title">🎈 Kids Corner (Ages 3–14)</h1>
        <p class="page-subtitle">Fun stories, interactive reading, and foundational English activities!</p>
        <div class="grid" id="kids-grid"></div>
    </main>
    <script>
        async function loadKidsLessons() {
            try {
                const response = await fetch('../lessons.json');
                const data = await response.json();
                const grid = document.getElementById('kids-grid');
                grid.innerHTML = (data.kids || []).map(item => `
                    <div class="card">
                        ${item.image ? `<img src="${item.image}" class="card-img" alt="${item.title}">` : ''}
                        <div class="card-content">
                            <h3>${item.title || ''}</h3>
                            <p>${item.description || ''}</p>
                            <a href="../${item.link || '#'}" class="btn">Play Story</a>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Error loading kids lessons:", err);
            }
        }
        loadKidsLessons();
    </script>
</body>
</html>
