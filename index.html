<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The English Language School</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        /* Vibrant Blue Gradient Background */
        body { 
            background: linear-gradient(180deg, #0b192c 0%, #1e3e62 40%, #0f172a 100%); 
            background-attachment: fixed;
            color: #0f172a; 
            line-height: 1.6; 
            min-height: 100vh;
        }
        
        /* Modern Header & Navigation */
        .main-header {
            background-color: rgba(11, 25, 44, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 3px solid #ff6500;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-btn {
            color: #ffffff;
            text-decoration: none;
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-btn:hover {
            background-color: #ff6500;
            border-color: #ff6500;
            color: #ffffff;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 0.5rem;
            background-color: #ffffff;
            min-width: 200px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            border-radius: 8px;
            overflow: hidden;
            z-index: 100;
            border: 1px solid #cbd5e1;
        }

        .dropdown-content a {
            color: #0f172a;
            padding: 0.75rem 1.2rem;
            text-decoration: none;
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s ease;
        }

        .dropdown-content a:hover {
            background-color: #fff3eb;
            color: #d94600;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* Hero Section */
        .hero { 
            text-align: center; 
            padding: 3.5rem 1rem 2rem; 
            color: #ffffff;
        }
        .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .hero p { color: #cbd5e1; font-size: 1.15rem; }
        
        .container { max-width: 1100px; margin: 1.5rem auto 3rem; padding: 0 1rem; }
        
        .section-title { 
            font-size: 1.6rem; 
            color: #ffffff; 
            margin: 2rem 0 1.5rem; 
            border-bottom: 3px solid #ff6500; 
            display: inline-block; 
            padding-bottom: 0.2rem; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        /* Grid Layout */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 1.8rem; 
        }

        /* High-Contrast Standout Cards */
        .card { 
            background: #ffffff; 
            border-radius: 14px; 
            overflow: hidden;
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35); 
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        }
        
        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }
        
        .card-content {
            padding: 1.4rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .badge { 
            align-self: flex-start; 
            background-color: #fff3eb; 
            color: #d94600; 
            border: 1px solid #ffcbac;
            font-size: 0.75rem; 
            font-weight: 700; 
            padding: 0.25rem 0.65rem; 
            border-radius: 6px; 
            text-transform: uppercase; 
            margin-bottom: 0.6rem; 
        }
        .date { font-size: 0.8rem; color: #64748b; margin-bottom: 0.5rem; }
        .card h3 { font-size: 1.25rem; color: #0b192c; margin-bottom: 0.5rem; font-weight: 700; }
        .card p { font-size: 0.95rem; color: #475569; margin-bottom: 1.4rem; flex-grow: 1; }
        
        .btn { 
            display: block; 
            text-align: center; 
            background-color: #ff6500; 
            color: #fff; 
            text-decoration: none; 
            padding: 0.7rem 1rem; 
            border-radius: 8px; 
            font-weight: 700; 
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(255, 101, 0, 0.3);
        }
        .btn:hover { background-color: #e05500; }

        /* Kids Container Box */
        .kids-box { 
            background: rgba(255, 255, 255, 0.07); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 18px; 
            padding: 2rem; 
            margin: 3.5rem 0; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        /* Full Library List Box */
        .library-list { 
            background: #ffffff; 
            border-radius: 14px; 
            overflow: hidden; 
            margin-top: 1rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }
        .library-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #f1f5f9; }
        .library-item:last-child { border-bottom: none; }
        .library-info { display: flex; gap: 1rem; align-items: center; }
        .library-thumb { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
    </style>
</head>
<body>

    <!-- NAVIGATION HEADER -->
    <header class="main-header">
      <div class="logo">The English Language School</div>
      <nav class="nav-links">
        <a href="index.html" class="nav-btn">Home</a>
        <div class="dropdown">
          <a href="#featured-adult" class="nav-btn">Lessons ▾</a>
          <div class="dropdown-content">
            <a href="#featured-adult">Adult Lessons</a>
            <a href="#kids-lessons">Kids Corner</a>
            <a href="#adult-library">Full Library</a>
          </div>
        </div>
      </nav>
    </header>

    <section class="hero">
        <h1>The English Language School</h1>
        <p>Daily interactive lessons & full practice library</p>
    </section>

    <main class="container">
        
        <!-- Featured Adult Lessons -->
        <h2 class="section-title" id="featured-adult">Featured Adult Lessons</h2>
        <div class="grid" id="adult-grid"></div>

        <!-- Kids Lessons Banner Box -->
        <div class="kids-box" id="kids-lessons">
            <h2 class="section-title" style="margin-top: 0;">🎈 Kids Corner</h2>
            <div class="grid" id="kids-grid"></div>
        </div>

        <!-- Full Library List -->
        <h2 class="section-title" id="adult-library">Lesson Library (Past Lessons)</h2>
        <div class="library-list" id="library-container"></div>

    </main>

    <script>
        async function loadLessons() {
            try {
                const response = await fetch('lessons.json');
                const data = await response.json();

                // 1. Load up to 3 Adult Lessons
                const adultGrid = document.getElementById('adult-grid');
                const featuredAdults = data.adults.slice(0, 3);
                adultGrid.innerHTML = featuredAdults.map(lesson => `
                    <div class="card">
                        ${lesson.image ? `<img src="${lesson.image}" alt="${lesson.title}" class="card-img">` : ''}
                        <div class="card-content">
                            ${lesson.category ? `<span class="badge">${lesson.category}</span>` : ''}
                            <div class="date">${lesson.date}</div>
                            <h3>${lesson.title}</h3>
                            <p>${lesson.description}</p>
                            <a href="${lesson.link}" class="btn">Start Lesson</a>
                        </div>
                    </div>
                `).join('');

                // 2. Load up to 3 Kids Lessons
                const kidsGrid = document.getElementById('kids-grid');
                const featuredKids = data.kids.slice(0, 3);
                kidsGrid.innerHTML = featuredKids.map(lesson => `
                    <div class="card">
                        ${lesson.image ? `<img src="${lesson.image}" alt="${lesson.title}" class="card-img">` : ''}
                        <div class="card-content">
                            <div class="date">${lesson.date}</div>
                            <h3>${lesson.title}</h3>
                            <p>${lesson.description}</p>
                            <a href="${lesson.link}" class="btn">Play Story</a>
                        </div>
                    </div>
                `).join('');

                // 3. Load All Lessons into Library List
                const libraryContainer = document.getElementById('library-container');
                libraryContainer.innerHTML = data.adults.map(lesson => `
                    <div class="library-item">
                        <div class="library-info">
                            ${lesson.image ? `<img src="${lesson.image}" alt="" class="library-thumb">` : ''}
                            <div>
                                ${lesson.category ? `<span class="badge">${lesson.category}</span>` : ''}
                                <div><strong>${lesson.title}</strong></div>
                                <div class="date">${lesson.date}</div>
                            </div>
                        </div>
                        <a href="${lesson.link}" class="btn" style="padding: 0.35rem 0.9rem; font-size: 0.85rem;">View</a>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Error loading lesson library:", err);
            }
        }

        loadLessons();
    </script>
</body>
</html>
