<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Articles & Lessons | The English Language School</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(180deg, #0b192c 0%, #1e3e62 40%, #0f172a 100%); background-attachment: fixed; color: #0f172a; line-height: 1.6; min-height: 100vh; }
        
        .main-header { background-color: rgba(11, 25, 44, 0.85); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 3px solid #ff6500; position: sticky; top: 0; z-index: 1000; }
        .logo { color: #ffffff; font-size: 1.3rem; font-weight: 700; text-decoration: none; }
        .nav-btn { color: #ffffff; text-decoration: none; padding: 0.5rem 1.2rem; border-radius: 6px; font-weight: 600; background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .nav-btn:hover { background-color: #ff6500; border-color: #ff6500; }
        
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .page-title { color: #ffffff; font-size: 2.2rem; margin-bottom: 0.5rem; text-align: center; }
        .page-subtitle { color: #cbd5e1; text-align: center; margin-bottom: 2rem; font-size: 1.1rem; }
        
        /* Subcategory Filter Buttons */
        .filter-bar { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2.5rem; flex-wrap: wrap; }
        .filter-btn { background: rgba(255,255,255,0.1); color: #ffffff; border: 1px solid rgba(255,255,255,0.2); padding: 0.6rem 1.4rem; border-radius: 20px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; font-size: 0.95rem; }
        .filter-btn.active, .filter-btn:hover { background: #ff6500; border-color: #ff6500; color: #ffffff; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; }
        .card { background: #ffffff; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .card-img { width: 100%; height: 160px; object-fit: cover; }
        .card-content { padding: 1.2rem; display: flex; flex-direction: column; flex-grow: 1; }
        .badge { align-self: flex-start; background-color: #fff3eb; color: #d94600; border: 1px solid #ffcbac; font-size: 0.75rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 6px; text-transform: uppercase; margin-bottom: 0.5rem; }
        .card h3 { font-size: 1.1rem; color: #0b192c; margin-bottom: 0.5rem; }
        .card p { font-size: 0.9rem; color: #475569; margin-bottom: 1.2rem; flex-grow: 1; }
        .btn { display: block; text-align: center; background-color: #ff6500; color: #fff; text-decoration: none; padding: 0.7rem; border-radius: 8px; font-weight: 700; }
        .btn:hover { background-color: #e05500; }
    </style>
</head>
<body>

    <header class="main-header">
      <a href="../index.html" class="logo">The English Language School</a>
      <a href="../index.html" class="nav-btn">← Home</a>
    </header>

    <main class="container">
        <h1 class="page-title">Daily Articles & Lessons</h1>
        <p class="page-subtitle">Select a category below to explore focused lessons and readings.</p>

        <!-- Subcategory Filter Bar -->
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterArticles('All', this)">All Subcategories</button>
            <button class="filter-btn" onclick="filterArticles('Business English', this)">Business English</button>
            <button class="filter-btn" onclick="filterArticles('History', this)">History</button>
            <button class="filter-btn" onclick="filterArticles('Life', this)">Life</button>
            <button class="filter-btn" onclick="filterArticles('Entertainment', this)">Entertainment</button>
        </div>

        <div class="grid" id="articles-grid"></div>
    </main>

    <script>
        let allArticles = [];

        async function loadArticles() {
            try {
                const response = await fetch('../lessons.json');
                const data = await response.json();
                allArticles = data.adults || [];
                renderGrid(allArticles);
            } catch (err) {
                console.error("Error loading articles:", err);
            }
        }

        function renderGrid(articles) {
            const grid = document.getElementById('articles-grid');
            if (!articles.length) {
                grid.innerHTML = `<p style="color: #ffffff; text-align: center; grid-column: 1/-1;">No articles available in this subcategory yet.</p>`;
                return;
            }
            grid.innerHTML = articles.map(a => `
                <div class="card">
                    ${a.image ? `<img src="${a.image}" class="card-img" alt="${a.title}">` : ''}
                    <div class="card-content">
                        <span class="badge">${a.category || 'Article'}</span>
                        <h3>${a.title || ''}</h3>
                        <p>${a.description || ''}</p>
                        <a href="../${a.link || '#'}" class="btn">Read Article</a>
                    </div>
                </div>
            `).join('');
        }

        function filterArticles(category, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            if (category === 'All') {
                renderGrid(allArticles);
            } else {
                const filtered = allArticles.filter(item => item.category === category);
                renderGrid(filtered);
            }
        }

        loadArticles();
    </script>
</body>
</html>
