<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The English Language School</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; line-height: 1.6; }
        
        /* Hero Section */
        .hero { 
            background: linear-gradient(135deg, #0b192c, #1e3e62); 
            color: #fff; 
            text-align: center; 
            padding: 3.5rem 1rem; 
            border-bottom: 4px solid #ff6500;
        }
        .hero h1 { font-size: 2.4rem; margin-bottom: 0.5rem; }
        .hero p { color: #e2e8f0; font-size: 1.1rem; }
        
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .section-title { 
            font-size: 1.6rem; 
            color: #0b192c; 
            margin: 2rem 0 1rem; 
            border-bottom: 3px solid #ff6500; 
            display: inline-block; 
            padding-bottom: 0.2rem; 
        }
        
        /* Grid and Card Layout */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
        .card { 
            background: #fff; 
            border: 1px solid #cbd5e1; 
            border-radius: 12px; 
            overflow: hidden;
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); 
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }
        
        .card-content {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* Orange Category Badges */
        .badge { 
            align-self: flex-start; 
            background-color: #fff3eb; 
            color: #d94600; 
            border: 1px solid #ffcbac;
            font-size: 0.75rem; 
            font-weight: 700; 
            padding: 0.2rem 0.6rem; 
            border-radius: 4px; 
            text-transform: uppercase; 
            margin-bottom: 0.5rem; 
        }
        .date { font-size: 0.8rem; color: #64748b; margin-bottom: 0.5rem; }
        .card h3 { font-size: 1.2rem; color: #0b192c; margin-bottom: 0.5rem; }
        .card p { font-size: 0.95rem; color: #475569; margin-bottom: 1.2rem; flex-grow: 1; }
        
        /* Primary Action Buttons */
        .btn { 
            display: block; 
            text-align: center; 
            background-color: #ff6500; 
            color: #fff; 
            text-decoration: none; 
            padding: 0.6rem 1rem; 
            border-radius: 6px; 
            font-weight: 700; 
            transition: background-color 0.2s ease;
        }
        .btn:hover { background-color: #e05500; }

        /* Lesson Library List with Small Thumbnails */
        .library-list { background: #fff; border-radius: 12px; border: 1px solid #cbd5e1; overflow: hidden; margin-top: 1rem; }
        .library-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 1rem; border-bottom: 1px solid #f1f5f9; }
        .library-item:last-child { border-bottom: none; }
        .library-info { display: flex; gap: 1rem; align-items: center; }
        .library-thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
        
        /* Kids Corner */
        .kids-box { 
            background: #fff8f0; 
            border: 2px dashed #ff6500; 
            padding: 1.5rem; 
            border-radius: 12px; 
            margin-top: 3rem; 
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1>The English Language School</h1>
        <p>Daily interactive lessons & full practice library</p>
    </section>

    <main class="container">
        
        <!-- Today's Featured Lesson -->
        <h2 class="section-title">Today's Featured Lesson</h2>
        <div class="grid" id="featured-adult"></div>

        <!-- Past Lessons Archive -->
        <h2 class="section-title">Lesson Library (Past Lessons)</h2>
        <div class="library-list" id="adult-library"></div>

        <!-- Kids Corner -->
        <div class="kids-box">
            <h2 class="section-title">🎈 Kids Corner</h2>
            <div class="grid" id="kids-lessons"></div>
        </div>

    </main>

    <script>
        async function loadLessons() {
            try {
                const response = await fetch('lessons.json');
                const data = await response.json();

                // 1. Load Today's Featured Adult Lesson
                const featured = data.adults.find(item => item.featured) || data.adults[0];
                document.getElementById('featured-adult').innerHTML = `
                    <div class="card">
                        ${featured.image ? `<img src="${featured.image}" alt="${featured.title}" class="card-img">` : ''}
                        <div class="card-content">
                            <span class="badge">${featured.category}</span>
                            <div class="date">${featured.date}</div>
                            <h3>${featured.title}</h3>
                            <p>${featured.description}</p>
                            <a href="${featured.link}" class="btn">Start Today's Lesson</a>
                        </div>
                    </div>
                `;

                // 2. Load Full Lesson Library
                const libraryContainer = document.getElementById('adult-library');
                libraryContainer.innerHTML = data.adults.map(lesson => `
                    <div class="library-item">
                        <div class="library-info">
                            ${lesson.image ? `<img src="${lesson.image}" alt="" class="library-thumb">` : ''}
                            <div>
                                <span class="badge">${lesson.category}</span>
                                <div><strong>${lesson.title}</strong></div>
                                <div class="date">${lesson.date}</div>
                            </div>
                        </div>
                        <a href="${lesson.link}" class="btn" style="padding: 0.3rem 0.8rem; font-size: 0.85rem;">View</a>
                    </div>
                `).join('');

                // 3. Load Kids Corner
                document.getElementById('kids-lessons').innerHTML = data.kids.map(lesson => `
                    <div class="card">
                        ${lesson.image ? `<img src="${lesson.image}" alt="${lesson.title}" class="card-img">` : ''}
                        <div class="card-content">
                            <div class="date">${lesson.date}</div>
                            <h3>${lesson.title}</h3>
                            <p>${lesson.description}</p>
                            <a href="${lesson.link}" class="btn">Play Story</a>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Error loading lesson library:", err);
            }
        }

        loadLessons();
    </script>
</body>
</html>
