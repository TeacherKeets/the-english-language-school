<script>
        async function loadLessons() {
            try {
                const response = await fetch('lessons.json');
                const data = await response.json();

                // 1. Load up to 3 Adult Lessons
                const adultGrid = document.getElementById('adult-grid');
                const featuredAdults = data.adults.slice(0, 3);
                adultGrid.innerHTML = featuredAdults.map(lesson => `
                    <div class="card">
                        ${lesson.image ? `<img src="${lesson.image}" alt="${lesson.title}" class="card-img">` : ''}
                        <div class="card-content">
                            ${lesson.category ? `<span class="badge">${lesson.category}</span>` : ''}
                            <div class="date">${lesson.date}</div>
                            <h3>${lesson.title}</h3>
                            <p>${lesson.description}</p>
                            <a href="${lesson.link}" class="btn">Start Lesson</a>
                        </div>
                    </div>
                `).join('');

                // 2. Load up to 4 Kids Lessons
                const kidsGrid = document.getElementById('kids-grid');
                const featuredKids = data.kids.slice(0, 4);
                kidsGrid.innerHTML = featuredKids.map(lesson => `
                    <div class="card">
                        ${lesson.image ? `<img src="${lesson.image}" alt="${lesson.title}" class="card-img">` : ''}
                        <div class="card-content">
                            <div class="date">${lesson.date}</div>
                            <h3>${lesson.title}</h3>
                            <p>${lesson.description}</p>
                            <a href="${lesson.link}" class="btn">Play Story</a>
                        </div>
                    </div>
                `).join('');

                // 3. Load All Lessons into Library List
                const libraryContainer = document.getElementById('library-container');
                libraryContainer.innerHTML = data.adults.map(lesson => `
                    <div class="library-item">
                        <div class="library-info">
                            ${lesson.image ? `<img src="${lesson.image}" alt="" class="library-thumb">` : ''}
                            <div>
                                ${lesson.category ? `<span class="badge">${lesson.category}</span>` : ''}
                                <div><strong>${lesson.title}</strong></div>
                                <div class="date">${lesson.date}</div>
                            </div>
                        </div>
                        <a href="${lesson.link}" class="btn" style="padding: 0.35rem 0.9rem; font-size: 0.85rem;">View</a>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Error loading lesson library:", err);
            }
        }

        loadLessons();
    </script>
