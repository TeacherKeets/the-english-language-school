<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The English Language School</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; line-height: 1.6; }
        
        .hero { background: linear-gradient(135deg, #0f172a, #2563eb); color: #fff; text-align: center; padding: 4rem 1rem; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .hero p { font-size: 1.2rem; opacity: 0.9; }

        .container { max-width: 1100px; margin: 3rem auto; padding: 0 1rem; }
        .section-header { margin-bottom: 1.5rem; font-size: 1.75rem; color: #0f172a; border-bottom: 3px solid #2563eb; display: inline-block; padding-bottom: 0.25rem; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .badge { align-self: flex-start; background-color: #dbeafe; color: #1e40af; font-size: 0.75rem; font-weight: bold; padding: 0.25rem 0.5rem; border-radius: 4px; text-transform: uppercase; margin-bottom: 0.75rem; }
        .card h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }
        .card p { font-size: 0.9rem; color: #64748b; margin-bottom: 1.5rem; flex-grow: 1; }
        
        .btn { display: block; text-align: center; background-color: #2563eb; color: #fff; text-decoration: none; padding: 0.6rem; border-radius: 6px; font-weight: 600; }
        .btn:hover { background-color: #1d4ed8; }

        /* Kids Corner Styling */
        .kids-section { background: #f0fdf4; border: 2px dashed #22c55e; padding: 2rem; border-radius: 16px; }
        .kids-header { color: #15803d; border-bottom-color: #22c55e; }
        .kids-card { border-color: #bbf7d0; }
        .btn-kids { background-color: #22c55e; }
        .btn-kids:hover { background-color: #16a34a; }
    </style>
</head>
<body>

    <section class="hero">
        <h1>Welcome to The English Language School</h1>
        <p>Interactive daily lessons tailored for adults and children</p>
    </section>

    <main class="container">
        
        <!-- Adult Section -->
        <h2 class="section-header">Today's Featured Lessons</h2>
        <div class="grid" id="adult-lessons">
            <!-- Dynamic Adult Cards Load Here -->
        </div>

        <!-- Kids Corner Section -->
        <div class="kids-section">
            <h2 class="section-header kids-header">🎈 Kids Corner</h2>
            <div class="grid" id="kids-lessons">
                <!-- Dynamic Kids Cards Load Here -->
            </div>
        </div>

    </main>

    <script>
        async function loadLessons() {
            try {
                const response = await fetch('lessons.json');
                const data = await response.json();

                // Render Adult Lessons
                const adultContainer = document.getElementById('adult-lessons');
                adultContainer.innerHTML = data.adults.map(lesson => `
                    <div class="card">
                        <div>
                            <span class="badge">${lesson.category}</span>
                            <h3>${lesson.title}</h3>
                            <p>${lesson.description}</p>
                        </div>
                        <a href="${lesson.link}" class="btn">Start Lesson</a>
                    </div>
                `).join('');

                // Render Kids Lessons
                const kidsContainer = document.getElementById('kids-lessons');
                kidsContainer.innerHTML = data.kids.map(lesson => `
                    <div class="card kids-card">
                        <div>
                            <h3>${lesson.title}</h3>
                            <p>${lesson.description}</p>
                        </div>
                        <a href="${lesson.link}" class="btn btn-kids">Play Story</a>
                    </div>
                `).join('');

            } catch (error) {
                console.error("Error loading lessons:", error);
            }
        }

        loadLessons();
    </script>
</body>
</html>
